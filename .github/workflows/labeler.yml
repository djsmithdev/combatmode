name: Labeler

# Labels PRs by the domains they touch (.github/labeler.yml). pull_request_target so fork PRs get
# labels too; it never checks out or runs PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
        with:
          sync-labels: true
