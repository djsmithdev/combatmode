name: Release Package

# Packages CombatMode/ with the BigWigs packager and uploads it to CurseForge, Wago and the GitHub
# release for `tag`. Called by release.yml; run it by hand (Actions > Run workflow) to retry a tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. 5.3.2)
        type: string
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the packager reads tags / history for the version

      # release.sh requires a directory at $topdir/.git when using -t.
      - name: Point CombatMode at repository git
        run: ln -sfn ../.git CombatMode/.git

      # Never add -g retail: it would upload Mainline only (the TOC's Interface-* lines tag the flavors).
      - name: Package and publish addon
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_DIR: ${{ github.workspace }}/.git
        with:
          args: >-
            -p "${{ vars.CURSEFORGE_PROJECT_ID }}"
            -a "${{ vars.WAGO_PROJECT_ID }}"
            -n "CombatMode-{project-version}"
            -t CombatMode
            -m .pkgmeta
