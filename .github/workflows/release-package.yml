name: Release Package

# Packages CombatMode/ with the BigWigs packager and uploads it to CurseForge, Wago and the GitHub
# release for `tag`. Called by release.yml; run it by hand (Actions > Run workflow) to retry a tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. 5.3.2)
        type: string
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # the packager reads tags / history for the version

      # release.sh requires a directory at $topdir/.git when using -t.
      - name: Point CombatMode at repository git
        run: ln -sfn ../.git CombatMode/.git

      # The packager's own script (BigWigsMods/packager v2, pinned), run directly instead of through the
      # action: called from release.yml this job inherits the push-to-master context, and release.sh
      # skips a branch push whose HEAD is already tagged ("Found future tag"). The inline GITHUB_* values
      # make it see a tag build. Never add -g retail: it would upload Mainline only (the TOC's
      # Interface-* lines tag the flavors).
      - name: Package and publish addon
        env:
          TAG: ${{ inputs.tag }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          GIT_WORK_TREE: ${{ github.workspace }}
          GIT_DIR: ${{ github.workspace }}/.git
        run: |
          curl -fsSL -o "$RUNNER_TEMP/release.sh" \
            https://raw.githubusercontent.com/BigWigsMods/packager/e50a250f8705041e40f2fa1ddcb280a686d65aa0/release.sh
          GITHUB_EVENT_NAME=push GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG" \
            bash "$RUNNER_TEMP/release.sh" \
            -p "${{ vars.CURSEFORGE_PROJECT_ID }}" \
            -a "${{ vars.WAGO_PROJECT_ID }}" \
            -n "CombatMode-{project-version}" \
            -t CombatMode \
            -m .pkgmeta
