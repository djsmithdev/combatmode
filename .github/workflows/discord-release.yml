name: Discord Release Notification

# Posts the release's changelog section to Discord. Called by release.yml after packaging; run it
# by hand (Actions > Run workflow) to re-announce a tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (e.g. 5.3.2)
        type: string
        required: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1

      - name: Send Discord embed
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK:-}" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured"
            exit 1
          fi

          # Discord embed descriptions are limited to 4096 characters; stay well below.
          python3 scripts/changelog-section.py "$VERSION" --max-chars 3000 > "$RUNNER_TEMP/changelog.txt"
          read -r RELEASE_URL RELEASED_AT < <(gh release view "$VERSION" --repo "$REPO" --json url,publishedAt --jq '"\(.url) \(.publishedAt)"')

          jq -n \
            --arg title "🚀 Action Combat Mode ${VERSION}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$(cat "$RUNNER_TEMP/changelog.txt")" \
            --arg timestamp "$RELEASED_AT" \
            --arg footer "$REPO" \
            '{embeds: [{title: $title, url: $url, color: 14729472, description: $desc, footer: {text: $footer}, timestamp: $timestamp}]}' \
            > "$RUNNER_TEMP/payload.json"

          echo "Sending release notification for ${VERSION}..."
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/payload.json"
