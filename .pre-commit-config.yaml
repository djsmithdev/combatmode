minimum_pre_commit_version: "3.0.0"

repos:
  - repo: local
    hooks:
      - id: stylua
        name: stylua
        entry: stylua --config-path stylua.toml
        language: system
        types: [lua]
        files: ^CombatMode/.*\.lua$
        exclude: ^CombatMode/Libs/
      - id: selene
        name: selene
        entry: selene --config selene.toml
        language: system
        types: [lua]
        files: ^CombatMode/.*\.lua$
        exclude: ^CombatMode/Libs/
      - id: changelog-synced
        name: changelog synced to ChangelogData.lua
        entry: pwsh -NoProfile -File scripts/check-changelog-synced.ps1
        language: system
        files: ^CombatMode/(CHANGELOG\.md|UI/Changelog/ChangelogData\.lua)$
        pass_filenames: false
